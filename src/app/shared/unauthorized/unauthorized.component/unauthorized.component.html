<div class="min-h-screen bg-slate-950 flex items-center justify-center p-6 relative overflow-hidden">
  
  <!-- Background Pattern -->
  <div class="absolute inset-0 opacity-[0.03]">
    <div class="absolute top-0 left-0 w-96 h-96 bg-emerald-500 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-red-500 rounded-full blur-3xl"></div>
  </div>

  <!-- Grid Lines -->
  <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:64px_64px]"></div>

  <!-- Main Content -->
  <div class="relative z-10 max-w-lg w-full text-center">
    
    <!-- Lock Icon -->
    <div class="mb-8">
      <div class="inline-flex items-center justify-center w-28 h-28 rounded-2xl bg-red-500/10 border border-red-500/20 backdrop-blur-sm">
        <svg class="w-14 h-14 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>
    </div>

    <!-- Error Code -->
    <div class="mb-2">
      <span class="text-8xl font-black text-white/5 select-none">403</span>
    </div>

    <!-- Title -->
    <h2 class="text-3xl font-bold text-white mb-3 -mt-16">
      Access <span class="text-red-500">Denied</span>
    </h2>

    <!-- Description -->
    <p class="text-slate-400 text-sm leading-relaxed mb-8 max-w-sm mx-auto">
      You don't have permission to access this page. 
      Please contact your administrator if you believe this is a mistake.
    </p>

    <!-- Divider with icon -->
    <div class="flex items-center gap-4 mb-8">
      <div class="flex-1 h-px bg-slate-800"></div>
      <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
      <div class="flex-1 h-px bg-slate-800"></div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      
      <!-- Go Back -->
      <button (click)="goBack()"
        class="group px-6 py-3 bg-slate-800/50 border border-slate-700/50 text-slate-300 font-medium rounded-xl hover:bg-slate-800 hover:border-slate-600 hover:text-white transition-all duration-300 backdrop-blur-sm">
        <svg class="w-4 h-4 inline-block mr-2 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Go Back
      </button>

      <!-- Return to Dashboard -->
      <a [routerLink]="dashboardLink"
        class="group px-6 py-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-semibold rounded-xl hover:bg-emerald-500 hover:text-white hover:shadow-lg hover:shadow-emerald-500/20 transition-all duration-300 backdrop-blur-sm">
        <svg class="w-4 h-4 inline-block mr-2 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Return to Dashboard
      </a>
    </div>

    <!-- Footer -->
    <div class="mt-10 pt-6 border-t border-slate-800/50">
      <p class="text-slate-600 text-xs tracking-wider">
        &copy; {{ currentYear }} ICIT Department — Gomal University
      </p>
    </div>

  </div>
</div>
