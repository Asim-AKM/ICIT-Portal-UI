<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900">
    <div class="max-w-md w-full">
        <div class="backdrop-blur-lg bg-white/10 rounded-3xl shadow-2xl overflow-hidden border border-white/20 p-8 md:p-10">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-white/10 backdrop-blur rounded-full flex items-center justify-center mx-auto mb-6 border border-white/20">
                    <i class="fas fa-key text-3xl text-emerald-400"></i>
                </div>
                <h2 class="text-3xl font-black text-white mb-2">Forgot Password?</h2>
                <p class="text-emerald-100/70 text-sm">No worries! Enter your registration number below</p>
            </div>

            <form class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-emerald-200 mb-2">Registration Number</label>
                    <div class="relative group">
                        <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-emerald-300 group-focus-within:text-emerald-400 transition"></i>
                        <input type="text" 
                               placeholder="e.g., 2024-GU-1234"
                               class="w-full bg-white/10 border border-white/20 rounded-xl px-11 py-4 text-white placeholder-white/50 focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-emerald-600 transform hover:-translate-y-0.5 transition-all duration-200 uppercase text-xs tracking-wider">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-6 text-center">
                <a routerLink="/login" class="text-sm text-emerald-200 hover:text-white transition flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left text-xs"></i>
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
