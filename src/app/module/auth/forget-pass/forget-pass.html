<div class="min-h-screen bg-linear-to-br from-slate-50 via-white to-slate-50 flex items-center justify-center p-4">
  
  <!-- Background Effects -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-emerald-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  </div>

  <!-- Card -->
  <div class="relative w-full max-w-md">
    
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 rounded-2xl shadow-xl mb-4">
        <i class="fas fa-shield-halved text-emerald-500 text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900">ICIT Portal</h2>
      <p class="text-slate-500 text-sm mt-1">Reset your password</p>
    </div>

    <!-- Steps Progress -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300"
             [class]="step === 'email' ? 'bg-emerald-500 text-white shadow-lg' : 'bg-emerald-100 text-emerald-600'">
          <i class="fas fa-envelope text-xs"></i>
        </div>
        <div class="w-8 h-0.5 rounded-full transition-all duration-300"
             [class]="step !== 'email' ? 'bg-emerald-500' : 'bg-slate-200'"></div>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300"
             [class]="step === 'otp' ? 'bg-emerald-500 text-white shadow-lg' : step === 'reset' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'">
          <i class="fas fa-key text-xs"></i>
        </div>
        <div class="w-8 h-0.5 rounded-full transition-all duration-300"
             [class]="step === 'reset' ? 'bg-emerald-500' : 'bg-slate-200'"></div>
      </div>
      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all duration-300"
           [class]="step === 'reset' ? 'bg-emerald-500 text-white shadow-lg' : 'bg-slate-100 text-slate-400'">
        <i class="fas fa-lock text-xs"></i>
      </div>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-8">
      
      <!-- Step 1: Email -->
      <div *ngIf="step === 'email'" class="animate-fade-in">
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-envelope text-emerald-600 text-2xl"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-800">Forgot Password?</h3>
          <p class="text-sm text-slate-500 mt-1">Enter your registered email to receive OTP</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Email Address</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="email" [(ngModel)]="email" placeholder="your@email.com"
                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3.5 text-sm focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition">
            </div>
          </div>

          <button (click)="sendOtp()" [disabled]="isLoading"
            class="w-full py-3.5 bg-linear-to-r from-emerald-500 to-emerald-600 text-white text-sm font-bold rounded-xl hover:from-emerald-600 hover:to-emerald-700 transition shadow-lg shadow-emerald-500/25 disabled:opacity-50">
            <i *ngIf="isLoading" class="fas fa-spinner fa-spin mr-2"></i>
            {{ isLoading ? 'Sending...' : 'Send OTP' }}
          </button>
        </div>

        <p class="text-center mt-6">
          <a routerLink="/login" class="text-sm text-slate-500 hover:text-emerald-600 transition">
            <i class="fas fa-arrow-left mr-1"></i>Back to Login
          </a>
        </p>
      </div>

      <!-- Step 2: OTP -->
      <div *ngIf="step === 'otp'" class="animate-fade-in">
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-key text-emerald-600 text-2xl"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-800">Enter OTP</h3>
          <p class="text-sm text-slate-500 mt-1">We sent a 6-digit code to <strong>{{ email }}</strong></p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">OTP Code</label>
            <div class="relative">
              <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="text" [(ngModel)]="otp" placeholder="000000" maxlength="6"
                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3.5 text-sm text-center tracking-[0.5em] font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition">
            </div>
          </div>

          <button (click)="verifyOtp()" [disabled]="isLoading || otp.length !== 6"
            class="w-full py-3.5 bg-linear-to-r from-emerald-500 to-emerald-600 text-white text-sm font-bold rounded-xl hover:from-emerald-600 hover:to-emerald-700 transition shadow-lg shadow-emerald-500/25 disabled:opacity-50">
            <i *ngIf="isLoading" class="fas fa-spinner fa-spin mr-2"></i>
            {{ isLoading ? 'Verifying...' : 'Verify OTP' }}
          </button>

          <div class="text-center">
            <button *ngIf="timer > 0" disabled class="text-sm text-slate-400">
              Resend OTP in {{ timer }}s
            </button>
            <button *ngIf="timer === 0" (click)="resendOtp()" class="text-sm text-emerald-600 hover:text-emerald-700 font-bold transition">
              Resend OTP
            </button>
          </div>
        </div>

        <p class="text-center mt-6">
          <button (click)="goBack()" class="text-sm text-slate-500 hover:text-emerald-600 transition">
            <i class="fas fa-arrow-left mr-1"></i>Change Email
          </button>
        </p>
      </div>

      <!-- Step 3: Reset Password -->
      <div *ngIf="step === 'reset'" class="animate-fade-in">
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-lock text-emerald-600 text-2xl"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-800">New Password</h3>
          <p class="text-sm text-slate-500 mt-1">Create a strong password for your account</p>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">New Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="newPassword" placeholder="Min 8 characters"
                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-12 py-3.5 text-sm focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition">
              <button (click)="togglePassword('password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'" class="text-sm"></i>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Confirm Password</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" placeholder="Re-enter password"
                class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-12 py-3.5 text-sm focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition">
              <button (click)="togglePassword('confirm')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'" class="text-sm"></i>
              </button>
            </div>
          </div>

          <button (click)="resetPassword()" [disabled]="isLoading"
            class="w-full py-3.5 bg-linear-to-r from-emerald-500 to-emerald-600 text-white text-sm font-bold rounded-xl hover:from-emerald-600 hover:to-emerald-700 transition shadow-lg shadow-emerald-500/25 disabled:opacity-50">
            <i *ngIf="isLoading" class="fas fa-spinner fa-spin mr-2"></i>
            {{ isLoading ? 'Resetting...' : 'Reset Password' }}
          </button>
        </div>

        <p class="text-center mt-6">
          <button (click)="goBack()" class="text-sm text-slate-500 hover:text-emerald-600 transition">
            <i class="fas fa-arrow-left mr-1"></i>Back to OTP
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
