<!-- Show different layouts based on route -->
@switch (getLayoutType()) {
  
  <!-- Visitor Layout (existing header/footer) -->
  @case ('visitor') {
    <app-header></app-header>
    <router-outlet></router-outlet>
    <app-footer></app-footer>
  }

  <!-- Admin Dashboard Layout -->
  @case ('admin-header') {
    <app-admin-header></app-admin-header>
    <router-outlet></router-outlet>
  }

   <!-- Student Dashboard Layout -->
  @case ('student-header') {
    <app-student-header></app-student-header>
    <router-outlet></router-outlet>
  }

   <!-- Clerk Dashboard Layout -->
  @case ('clerk-header') {
    <app-clerk-header></app-clerk-header>
    <router-outlet></router-outlet>
  }

  <!-- No layout for login page -->
  @default {
    <router-outlet></router-outlet>
  }
}
