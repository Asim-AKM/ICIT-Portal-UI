<!-- Show different layouts based on route -->
@switch (getLayoutType()) {
  
  <!-- Visitor Layout -->
  @case ('visitor') {
    <app-header></app-header>
    <router-outlet></router-outlet>
    <app-footer></app-footer>
  }

  <!-- Admin Dashboard Layout -->
  @case ('admin-header') {
    <app-admin-header></app-admin-header>
    <router-outlet></router-outlet>
    <app-dashboard-footer></app-dashboard-footer>
  }

  <!-- Student Dashboard Layout -->
  @case ('student-header') {
    <app-student-header></app-student-header>
    <router-outlet></router-outlet>
    <app-dashboard-footer></app-dashboard-footer>
  }

  <!-- Clerk Dashboard Layout -->
  @case ('clerk-header') {
    <app-clerk-header></app-clerk-header>
    <router-outlet></router-outlet>
    <app-dashboard-footer></app-dashboard-footer>
  }

  <!-- Faculty Dashboard Layout -->
  @case ('faculty-header') {
    <app-faculty-header></app-faculty-header>
    <router-outlet></router-outlet>
    <app-dashboard-footer></app-dashboard-footer>
  }

  <!-- ✅ Unauthorized — No header, no footer -->
  @case ('unauthorized') {
    <router-outlet></router-outlet>
  }

  <!-- No layout for login, forget-pass etc -->
  @default {
    <router-outlet></router-outlet>
  }
}
